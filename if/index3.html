<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if 2형식 응용</title>
</head>
<body>
    
    <script>
        // 외부로부터 숫자 data를 입력 받아서 해당 data가 짝수/홀수인지 판단하는 프로그램

        let num = prompt("숫자를 입력하세요")
        let res = ''
        if(num%2==0){
            res = "짝수"
        }else{
            res = "홀수"
            }
        // 출력
        alert("고객님이 입력한 숫자" + num + "는" + res + "입니다.")
    </script>
</body>
</html>

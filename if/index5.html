<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if문 응용 나이</title>
</head>
<body>
    <script>
        let age = prompt("나이를 입력해주세요")
        let ak = '';

        if(age>=19){
            ak = "성인"
        }else{
            ak = "미성년자"
        }

        alert("고객님의 나이 (만)" + age + "세는 " + ak + "입니다.")
    </script>
</body>
</html>

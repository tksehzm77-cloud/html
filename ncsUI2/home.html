<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>JEJU LOOP - Home</title>
  <link rel="stylesheet" href="./css/home.css" />
</head>
<body>
  <div class="app">

    <main class="screen" id="screen">
      <!-- HERO -->
      <section class="hero">
        <div class="hero__top">
          <div class="profile">
            <img class="profile__img" src="./images/user.png" alt="프로필" />
          </div>

          <p class="hero__greet">
            권나영님 안녕하우꽈<br />
            즐거운 자전거여행이 되세요.
          </p>
        </div>

        <!-- ✅ 문구 밑 메인 이미지 영역(사용자가 이미지 삽입) -->
        <!-- <div class="hero__mainImg" aria-label="메인 이미지 영역"> -->
          <!-- 이 이미지 파일을 시안의 메인 이미지로 교체하세요 -->
          <!-- <img src="./img/hero-main.png" alt="메인 이미지" /> -->
        <!-- </div> -->

        <!-- 오버레이 카드 영역 -->
        <div class="overlay">
          <article class="card weather">
            <div class="weather__left">
              <p class="weather__status">Mostly Sunny</p>
              <p class="weather__temp"><span>20</span>°</p>
            </div>
            <div class="weather__right">
              <img src="./images/weather.png" alt="weather" class="weather__icon" />
            </div>
          </article>

          <article class="card course">
            <div class="course__row">
              <p class="course__label">완주코스</p>
              <p class="course__value">1/10</p>
            </div>
            <div class="course__divider"></div>
            <div class="course__row">
              <p class="course__label">이동거리</p>
              <p class="course__value">15km</p>
            </div>
          </article>
        </div>
      </section>

      <!-- SECTION: Guide slider -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">제주도 자전거 여행정보 가이드</h2>
        </div>

        <!-- ✅ 손으로 쓸어넘기는 슬라이드 -->
        <div class="guideSlider" id="guideSlider" aria-label="가이드 슬라이드">
          <div class="guideTrack">
            <button class="guideSlide" type="button">
              <img src="./images/slide1.jpg" alt="가이드 1" />
            </button>
            <button class="guideSlide" type="button">
              <img src="./images/slide2.jpg" alt="가이드 2" />
            </button>
            <button class="guideSlide" type="button">
              <img src="./images/slide3.jpg" alt="가이드 3" />
            </button>
          </div>
        </div>

        <div class="section__foot">
          <h3 class="section__subtitle">제주도 자전거 여행정보 가이드</h3>
          <button class="more" type="button">더보기</button>
        </div>
      </section>

      <!-- Feed -->
      <section class="feed">
        <article class="feedCard">
          <div class="feedCard__imgWrap">
            <img src="./img/feed-1.jpg" alt="자전거 패키지 1" />
          </div>
        </article>

        <article class="feedCard feedCard--withText">
          <div class="feedCard__imgWrap">
            <img src="./img/feed-2.jpg" alt="자전거 패키지 2" />
          </div>
          <div class="feedCard__overlayText">
            <p>제주도 자전거 여행 패키지<br />두번째 코스 이야기</p>
          </div>
        </article>

        <article class="feedCard feedCard--withText">
          <div class="feedCard__imgWrap">
            <img src="./img/feed-3.jpg" alt="자전거 패키지 3" />
          </div>
          <div class="feedCard__overlayText">
            <p>제주도 자전거 여행 패키지<br />세번째 코스 이야기</p>
          </div>
        </article>
      </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottomNav" aria-label="하단 네비게이션">
      <button class="navItem is-active" data-tab="home" type="button">
        <span class="navIcon">🏠</span>
        <span class="navText">홈</span>
      </button>
      <button class="navItem" data-tab="community" type="button">
        <span class="navIcon">📄</span>
        <span class="navText">커뮤니티</span>
      </button>
      <button class="navItem" data-tab="course" type="button">
        <span class="navIcon">🗺️</span>
        <span class="navText">코스</span>
      </button>
      <button class="navItem" data-tab="ranking" type="button">
        <span class="navIcon">👑</span>
        <span class="navText">랭킹</span>
      </button>
      <button class="navItem" data-tab="my" type="button">
        <span class="navIcon">👤</span>
        <span class="navText">마이</span>
      </button>
    </nav>
  </div>

  <script src="./js/home.js"></script>
</body>
</html>

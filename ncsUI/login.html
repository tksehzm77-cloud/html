<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAMBAK 로그인</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="page" role="main">
    <header class="brand" aria-label="CAMBAK">
      <!-- 시안의 ^ 형태 심볼 -->
      <svg class="mark" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24 66 L60 24 L96 66" stroke="var(--brand)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="word">CAMBAK</div>
    </header>

    <section class="form" aria-label="로그인">
      <!-- 아이디 -->
      <div class="field">
        <label class="label" for="userId">아이디</label>
        <input id="userId" class="underline" type="text" placeholder="아이디를 입력해주세요" autocomplete="username" inputmode="text" />
        <div class="line" aria-hidden="true"></div>
      </div>

      <!-- 비밀번호 -->
      <div class="field">
        <label class="label" for="pw">비밀번호</label>
        <input id="pw" class="underline password" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" />
        <div class="line" aria-hidden="true"></div>
      </div>

      <button class="btn primary" type="button">로그인</button>
      <button class="btn secondary" type="button">회원가입</button>

      <nav class="links" aria-label="계정 도움">
        <a href="#" role="link">아이디 찾기</a>
        <span class="sep">|</span>
        <a href="#" role="link">비밀번호 찾기</a>
        <span class="sep">|</span>
        <a href="#" role="link">둘러보기</a>
      </nav>

      <div class="social-wrap" aria-label="간편 로그인">
        <div class="social-title">간편 로그인</div>
        <div class="social">
          <!-- Kakao -->
          <button class="icon-btn" type="button" aria-label="카카오로 로그인">
            <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="6" y="6" width="52" height="52" rx="12" fill="#FEE500"/>
              <text x="32" y="39" text-anchor="middle" font-size="18" font-weight="900" fill="#000" font-family="-apple-system, BlinkMacSystemFont, Pretendard, Noto Sans KR, sans-serif">TALK</text>
            </svg>
          </button>

          <!-- Naver -->
          <button class="icon-btn" type="button" aria-label="네이버로 로그인">
            <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="6" y="6" width="52" height="52" rx="12" fill="#ffffff"/>
              <path d="M20 46V18h6l12 17V18h6v28h-6L26 29v17h-6z" fill="#03C75A"/>
            </svg>
          </button>

          <!-- Google -->
          <button class="icon-btn" type="button" aria-label="구글로 로그인">
            <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="6" y="6" width="52" height="52" rx="12" fill="#ffffff"/>
              <path d="M32 29v6h12c-.8 6-6 10-12 10-7 0-13-6-13-13s6-13 13-13c3.5 0 6 1.5 8 3.3l4-4C41 15 37 13 32 13c-10.5 0-19 8.5-19 19s8.5 19 19 19c11 0 18.5-7.7 18.5-18.5 0-1.3-.2-2.3-.4-3.5H32z" fill="#4285F4"/>
              <path d="M16.5 24.6l5 3.7C23 24.4 27.2 21 32 21c3.5 0 6 1.5 8 3.3l4-4C41 15 37 13 32 13c-7.3 0-13.7 4.1-16.5 11.6z" fill="#EA4335"/>
              <path d="M32 51c5.6 0 10.2-2 13.5-5.4l-5.2-4.3C38.3 43.2 35.6 45 32 45c-5.8 0-10.7-3.9-12.4-9.2l-5.2 4C17.2 46.8 24 51 32 51z" fill="#34A853"/>
              <path d="M19.6 35.8c-.4-1.2-.6-2.5-.6-3.8s.2-2.6.6-3.8l-5.2-4C13.4 26 13 29 13 32s.4 6 1.4 8l5.2-4.2z" fill="#FBBC05"/>
            </svg>
          </button>

          <!-- Facebook -->
          <button class="icon-btn" type="button" aria-label="페이스북으로 로그인">
            <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="6" y="6" width="52" height="52" rx="12" fill="#ffffff"/>
              <path d="M38 22h5v-8h-5c-6 0-10 4-10 10v5h-7v8h7v17h8V37h7l2-8h-9v-4c0-2 1-3 2-3z" fill="#1877F2"/>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 비밀번호는 기본 password 타입으로 처리되어
    // 입력 시 자동으로 원형(●)으로 표시됩니다.
  </script>
</body>
</html>

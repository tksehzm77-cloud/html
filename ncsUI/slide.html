<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차박 서비스 온보딩</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />

  <link rel="stylesheet" href="./css/slide.css" />
</head>
<body>

  <div class="swiper onboarding-swiper">
    <div class="swiper-wrapper">

      <!-- Slide 1 -->
      <div class="swiper-slide">
        <div class="content">
          <h1>
            <span class="highlight">차박,</span><br />
            어디로 떠나야 할지 모르겠나요?
          </h1>
          <p>
            지도 기반 위치 앱 및 키워드 검색으로<br />
            내가 원하는 장소를 한번에!
          </p>

          <img
            src="./images/img1.png"
            alt="차박 장소 추천"
            class="main-image"
          />
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="swiper-slide">
        <div class="content">
          <h1>
            차만 있다면<br />
            <span class="highlight">장비는 렌탈로!</span>
          </h1>
          <p>
            가격 부담 없이<br />
            차박에 필요한 물품을 골라보세요.
          </p>

          <img
            src="./images/img2.png"
            alt="차박 장비 렌탈"
            class="main-image"
          />
        </div>
      </div>

      <!-- Slide 3 -->
      <div class="swiper-slide">
        <div class="content">
          <h1>
            일상이 바쁠 땐<br />
            <span class="highlight">실시간 라이브로 대리만족해 보세요!</span>
          </h1>
          <p>
            라이브로 나를 뽐내고<br />
            시청자들과 소통하는 즐거움!
          </p>

          <img
            src="./images/img3.png"
            alt="차박 장비 렌탈"
            class="main-image"
          />
        </div>
      </div>

    </div>

    <!-- Pagination -->
    <div class="swiper-pagination"></div>

  </div>
  <!-- CTA -->
    <div class="cta-wrapper">
      <button class="cta-btn" id="startBtn">시작하기</button>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>

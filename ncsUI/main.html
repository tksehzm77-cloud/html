<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAMBAK</title>
  <style>
    /* ===== Reset ===== */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
      background:#F6F8FB;
      color:#111827;
      overflow-x:hidden;
    }
    button{font-family:inherit}

    :root{
      --brand:#586BB9;
      --navH:78px;
      --card:#fff;
      --line:#E5E7EB;
    }

    /* ===== Responsive Shell =====
       - Mobile: 430px 기준으로 중앙 정렬
       - Tablet/PC: 최대 1200px까지 확장
    */
    .container{
      width:100%;
      margin:0 auto;
      background:var(--card);
      min-height:100vh;
      max-width:430px;            /* 모바일 기본 */
      box-shadow:0 0 0 rgba(0,0,0,0);
    }

    /* 데스크탑/태블릿에서 양옆 여백 */
    @media (min-width: 768px){
      .container{ max-width: 920px; border-radius: 18px; margin: 18px auto; box-shadow: 0 18px 60px rgba(17,24,39,.08); }
      body{ padding: 0 18px; }
    }
    @media (min-width: 1200px){
      .container{ max-width: 1200px; }
    }

    /* 페이지 하단 여백(모바일 고정 네비에 가려지지 않도록) */
    .page{ padding-bottom: calc(var(--navH) + 20px); }

    /* ===== HERO (360x250 비율 유지, 반응형) ===== */
    .hero{
      position:relative;
      width:100%;
      aspect-ratio: 360 / 250;   /* 핵심: 화면폭에 따라 높이 자동 */
      overflow:hidden;
      border-radius:0 0 26px 26px;
    }
    .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#fff 0%,rgba(255,255,255,.35) 48%,rgba(255,255,255,0) 100%)}

    .hero-inner{position:relative;height:100%;padding:clamp(14px,3.6vw,18px)}
    .brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .brand-name{letter-spacing:.4em;font-weight:800;color:rgba(88,107,185,.8);font-size:clamp(16px,2.2vw,20px)}
    .tabs{display:flex;gap:16px;font-weight:700;color:rgba(17,24,39,.65);font-size:clamp(13px,1.8vw,15px)}
    .tabs .active{color:#111827}

    .bell{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;position:relative;border:1px solid rgba(229,231,235,.9);backdrop-filter:blur(8px)}
    .bell::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;background:#EF4444;border-radius:50%;border:2px solid rgba(255,255,255,.9)}

    .hero-title{margin-top:clamp(10px,2.8vw,16px);font-size:clamp(18px,2.8vw,26px);font-weight:900;color:var(--brand);line-height:1.25}
    .hero-sub{margin-top:6px;font-size:clamp(12px,1.8vw,14px);font-weight:700;color:rgba(88,107,185,.8);line-height:1.35}

    /* ===== CATEGORY ===== */
    .section{padding:clamp(16px,3.6vw,20px)}
    .section-title{font-size:clamp(18px,2.8vw,24px);font-weight:900;color:var(--brand);margin-bottom:14px}

    .category-grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr); /* 모바일 */
      gap:14px;
    }
    /* 태블릿: 8개를 한 줄로 보기 좋게 */
    @media (min-width: 768px){
      .category-grid{ grid-template-columns: repeat(8, 1fr); gap:16px; }
    }

    .cat{text-align:center;font-weight:800;color:rgba(17,24,39,.75);font-size:14px}
    .cat .icon{width:46px;height:46px;margin:0 auto 8px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}

    .quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
    .quick{background:#F2F4F8;border:1px solid rgba(229,231,235,.9);border-radius:14px;padding:14px;font-weight:900;color:var(--brand);text-align:center}

    /* ===== RANKING ===== */
    .rank-title{padding:16px 18px;font-size:clamp(18px,2.8vw,24px);font-weight:900;color:var(--brand)}
    .rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px;background:#fff}

    /* 태블릿/PC: 3열로 확장(큰 카드는 2열 스팬) */
    @media (min-width: 768px){
      .rank-grid{ grid-template-columns: 1fr 1fr 1fr; gap:16px; padding: 0 20px 20px; }
    }

    .rank-card{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(229,231,235,.9);background:#fff}
    .rank-card.big{grid-column:1/-1;aspect-ratio:16/9}
    @media (min-width: 768px){
      .rank-card.big{ grid-column: 1 / span 2; }
    }

    .rank-card.small{aspect-ratio:1/1}
    .rank-card img{width:100%;height:100%;object-fit:cover;display:block}
    .rank-tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);border:1px solid rgba(229,231,235,.9);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;color:rgba(17,24,39,.78)}

    /* ===== PLACE ===== */
    .place{padding:18px;background:#fff}
    @media (min-width: 768px){ .place{ padding: 20px; } }
    .place-title{font-size:clamp(18px,2.8vw,24px);font-weight:900}
    .place-addr{margin-top:6px;font-size:clamp(13px,2.2vw,15px);font-weight:700;color:rgba(75,85,99,.85)}

    .place-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    .btn{padding:16px 14px;border-radius:16px;font-weight:900;font-size:clamp(16px,2.3vw,18px);border:2px solid var(--brand);cursor:pointer}
    .btn.primary{background:var(--brand);color:#fff}
    .btn.ghost{background:#fff;color:var(--brand)}

    /* ===== BOTTOM NAV =====
       - Mobile: fixed
       - Tablet/PC: fixed를 유지하면 어색할 수 있어 sticky로 전환
    */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:430px;
      height:var(--navH);
      background:rgba(255,255,255,.92);
      border-top:1px solid rgba(229,231,235,.95);
      display:flex;
      justify-content:space-around;
      align-items:center;
      backdrop-filter: blur(10px);
      z-index:50;
    }
    .nav-item{font-size:12px;font-weight:800;color:rgba(156,163,175,1);text-align:center}
    .nav-item.active{color:var(--brand)}

    @media (min-width: 768px){
      .bottom-nav{
        position: sticky;
        left: auto;
        transform: none;
        max-width: none;
        width: 100%;
        border-top: 1px solid rgba(229,231,235,.95);
      }
      .page{ padding-bottom: 20px; } /* sticky라서 추가 여백 불필요 */
    }

    /* iOS safe-area (모바일 fixed일 때) */
    @supports (padding: max(0px)){
      .bottom-nav{ padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      @media (max-width: 767.98px){
        .page{ padding-bottom: calc(var(--navH) + max(20px, env(safe-area-inset-bottom))); }
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="page">

    <!-- HERO IMAGE (교체 가능) -->
    <header class="hero">
      <img class="bg" src="./images/banner.png" alt="상단 배너 이미지" />
      <div class="hero-inner">
        <div class="brand-row">
          <div>
            <div class="brand-name">CAMBAK</div>
            <div class="tabs"><span class="active">추천</span><span>내 목적지</span></div>
          </div>
          <div class="bell">🔔</div>
        </div>
        <div class="hero-title">2025 여름 차박지 기획전</div>
        <div class="hero-sub">캠박에서 엄선해 추천하는<br>여름 차박지를 구경해 보세요.</div>
      </div>
    </header>

    <!-- CATEGORY -->
    <section class="section">
      <div class="section-title">테마별 카테고리</div>
      <div class="category-grid">
        <div class="cat"><div class="icon">🐶</div>반려견</div>
        <div class="cat"><div class="icon">🔥</div>불멍</div>
        <div class="cat"><div class="icon">🏙</div>도시</div>
        <div class="cat"><div class="icon">🍖</div>바베큐</div>
        <div class="cat"><div class="icon">🌳</div>산책</div>
        <div class="cat"><div class="icon">⛰</div>오지</div>
        <div class="cat"><div class="icon">🌠</div>별감상</div>
        <div class="cat"><div class="icon">🎒</div>장비</div>
      </div>

      <div class="quick-row">
        <div class="quick">쿠폰</div>
        <div class="quick">이벤트</div>
        <div class="quick">혜택</div>
      </div>
    </section>

    <!-- RANKING (이미지 교체 가능) -->
    <div class="rank-title">장소 랭킹 TOP 10</div>
    <section class="rank-grid">
      <div class="rank-card small">
        <img src="./images/camping1.jpg" alt="랭킹 이미지 1" />
        <div class="rank-tag">야경</div>
      </div>
      <div class="rank-card small">
        <img src="./images/camping2.jpg" alt="랭킹 이미지 2" />
        <div class="rank-tag">차박</div>
      </div>
      <div class="rank-card big">
        <img src="./images/camping.jpg" alt="랭킹 이미지 3" />
        <div class="rank-tag">야영</div>
      </div>
    </section>

    <!-- PLACE DETAIL -->
    <section class="place">
      <div class="place-title">강원도 숲캠핑장</div>
      <div class="place-addr">강원도 원주시 치악면 치악산 1번지</div>
      <div class="place-actions">
        <button class="btn primary">길찾기</button>
        <button class="btn ghost">해지하기</button>
      </div>
    </section>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      홈
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/>
        <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      검색
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/>
        <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      모임
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M10 9v6l5-3-5-3Z" fill="currentColor"/>
      </svg>
      LIVE
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/>
        <path d="M6 20c0-2.8 2.7-5 6-5s6 2.2 6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      MY
    </div>
  </nav>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMBAK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-container {
            margin-bottom: 0;
        }

        .logo-icon {
            width: 120px;
            height: 120px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .logo-text {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 12px;
            color: #5b7db1;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 40 L140 100 L100 90 L60 100 Z" 
                          fill="#5b7db1" 
                          stroke="none"/>
                </svg>
            </div>
        </div>
        <div class="logo-text">CAMBAK</div>
    </div>

    <script>
        // 5초 후 네이버로 이동
        setTimeout(function() {
            window.location.href = 'https://www.naver.com';
        }, 5000);
    </script>
</body>
</html>

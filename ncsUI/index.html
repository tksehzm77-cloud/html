<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAMBAK</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", sans-serif;
    }

    /* Layout */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    /* Logo Symbol */
    .symbol {
      width: 72px;
      height: 48px;
      margin-bottom: 20px;
    }

    .symbol svg {
      width: 100%;
      height: 100%;
    }

    /* Logo Text */
    .logo-text {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 8px;
      color: #5A6FB5;
    }

    /* Animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo-wrap">
      <div class="symbol">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 50 L50 10 L90 50"
                fill="none"
                stroke="#5A6FB5"
                stroke-width="12"
                stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
      </div>
      <div class="logo-text">CAMBAK</div>
    </div>
  </main>
  <script>
    // 5초 후 네이버로 자동 이동
    setTimeout(function () {
      window.location.href = "../slide.html";
    }, 5000);
  </script>
</body>
</html>

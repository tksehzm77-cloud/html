<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login</title>
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <main class="app">
    <!-- 상단 로고(사용자 이미지 삽입) -->
    <section class="hero" aria-label="logo area">
      <!-- 로고를 이미지로 넣고 싶으면 src만 교체하세요 -->
      <img class="logo" src="./images/logo.png" alt="로고" />
      <!-- 로고 이미지가 없을 때를 위한 안전장치(자동 숨김/표시: JS) -->
      <div class="logo-fallback" aria-hidden="true">
        <!-- 여기는 비워둬도 됩니다(시안처럼 중앙 아이콘 영역) -->
      </div>
    </section>

    <!-- 입력 폼 -->
    <section class="form-wrap">
      <form class="login-form" id="loginForm" autocomplete="on">
        <label class="field">
          <input
            type="text"
            name="userId"
            placeholder="아이디 또는 이메일을 입력해주세요."
            autocomplete="username"
          />
        </label>

        <label class="field">
          <input
            type="password"
            name="password"
            placeholder="비밀번호를 입력해주세요."
            autocomplete="current-password"
          />
        </label>

        <!-- 옵션 체크 -->
        <div class="options">
          <label class="check">
            <input type="checkbox" name="autoLogin" checked />
            <span class="dot" aria-hidden="true"></span>
            <span class="txt">자동 로그인</span>
          </label>

          <label class="check">
            <input type="checkbox" name="saveId" />
            <span class="dot" aria-hidden="true"></span>
            <span class="txt">아이디 저장</span>
          </label>
        </div>

        <button type="submit" class="btn-login">로그인</button>

        <!-- 하단 링크 -->
        <nav class="links" aria-label="login links">
          <a href="#" class="link">아이디 찾기</a>
          <span class="sep">|</span>
          <a href="#" class="link">비밀번호 찾기</a>
          <span class="sep">|</span>
          <a href="#" class="link">회원가입</a>
        </nav>
      </form>

      <div class="divider"></div>

      <!-- SNS 간편로그인 -->
      <section class="sns" aria-label="sns login">
        <p class="sns-title">SNS 간편로그인</p>

        <div class="sns-row">
          <!-- 아이콘은 사용자가 직접 넣기: src 교체 -->
          <button type="button" class="sns-btn" aria-label="네이버 로그인">
            <img class="sns-ico" src="./images/naver.png" alt="네이버" />
            <span class="sns-fallback">N</span>
          </button>

          <button type="button" class="sns-btn" aria-label="카카오 로그인">
            <img class="sns-ico" src="./images/kakao.png" alt="카카오" />
            <span class="sns-fallback">K</span>
          </button>

          <button type="button" class="sns-btn" aria-label="페이스북 로그인">
            <img class="sns-ico" src="./images/facebook.png" alt="페이스북" />
            <span class="sns-fallback">f</span>
          </button>

          <button type="button" class="sns-btn" aria-label="애플 로그인">
            <img class="sns-ico" src="./images/apple.png" alt="애플" />
            <span class="sns-fallback">a</span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <script src="./js/login.js"></script>
</body>
</html>

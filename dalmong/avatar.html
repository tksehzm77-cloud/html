<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나의 아바타</title>

  <!-- Noto Sans (나머지 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/avatar.css" />
</head>
<body>
  <div class="app">
    <!-- 상단 헤더 -->
    <header class="topbar">
      <button class="icon-btn" type="button" aria-label="뒤로가기">
        <!-- 사용자가 직접 아이콘 넣기 -->
        <img class="icon" src="./images/back.png" alt="" />
      </button>

      <h1 class="topbar-title">나의 아바타</h1>

      <button class="icon-btn" type="button" aria-label="설정">
        <!-- 사용자가 직접 아이콘 넣기 -->
        <img class="icon" src="./images/set.png" alt="" />
      </button>
    </header>

    <!-- 스크롤 영역(하단 네비 고정 때문에 padding-bottom 줌) -->
    <main class="content" role="main">
      <!-- 메인 프리뷰 카드 -->
      <section class="preview-card" aria-label="아바타 프리뷰">
        <!-- 사용자가 직접 메인 이미지를 넣을 영역 -->
        <div class="preview-media">
          <!-- 권장: 실제 이미지 넣을 때 아래 img src만 채우기 -->
          <img class="preview-img" src="./images/avatar_on_img.jpg" alt="아바타 배경/캐릭터 이미지" />
        </div>

        <button class="save-btn" type="button">저장</button>
      </section>

      <!-- 탭 바 -->
      <nav class="tabs" aria-label="아바타 카테고리 탭">
        <button class="tab is-active" type="button" data-tab="hanbok">
          <span class="tab-icon">
            <!-- '한복' 옆 달 이미지: 사용자가 직접 넣기 -->
            <img class="tab-moon" src="./images/avatar_moon.png" alt="" />
          </span>
          <span class="tab-text">한복</span>
        </button>

        <a class="tab" href="avatar2.html">
          <span class="tab-text">노리개</span>
        </a>

        <button class="tab" type="button" data-tab="prop">
          <span class="tab-text">소품</span>
        </button>

        <button class="tab" type="button" data-tab="hair">
          <span class="tab-text">헤어</span>
        </button>

        <button class="tab" type="button" data-tab="face">
          <span class="tab-text">얼굴</span>
        </button>

        <button class="tab" type="button" data-tab="bg">
          <span class="tab-text">배경</span>
        </button>
      </nav>

      <!-- 아이템 그리드 (스크롤로 아래까지 내려가도록 길게) -->
      <section class="grid" aria-label="아이템 목록">
        <!-- 카드 1 -->
        <button class="item-card check" type="button">
          <div class="item-thumb">
            <!-- 사용자가 직접 아이템 이미지 넣기 -->
            <img class="item-img" src="./images/hanbok_1.png" alt="아이템 1" />
          </div>
        </button>

        <!-- 카드 2 -->
        <button class="item-card" type="button">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_2.png" alt="아이템 2" />
          </div>
        </button>

        <!-- 카드 3 -->
        <button class="item-card" type="button">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_3.png" alt="아이템 3" />
          </div>
        </button>

        <!-- 카드 4 -->
        <button class="item-card" type="button">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_4.png" alt="아이템 4" />
          </div>
        </button>

        <!-- 카드 5 -->
        <button class="item-card" type="button">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_5.png" alt="아이템 3" />
          </div>
        </button>

        <!-- 카드 6 -->
        <button class="item-card" type="button">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_6.png" alt="아이템 4" />
          </div>
        </button>

        <!-- 카드 7 (잠금 예시) -->
        <button class="item-card is-locked" type="button" aria-label="잠금된 아이템">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_7.png" alt="아이템 5" />
            <div class="lock-overlay" aria-hidden="true">
              <!-- 자물쇠 아이콘: 사용자가 직접 넣기 -->
              <img class="lock-icon" src="./images/lock.png" alt="" />
            </div>
          </div>
        </button>

        <!-- 카드 8 (잠금 예시) -->
        <button class="item-card is-locked" type="button" aria-label="잠금된 아이템">
          <div class="item-thumb">
            <img class="item-img" src="./images/hanbok_8.png" alt="아이템 6" />
            <div class="lock-overlay" aria-hidden="true">
              <img class="lock-icon" src="./images/lock.png" alt="" />
            </div>
          </div>
        </button>
      </section>
    </main>

    <!-- 하단 네비(고정) -->
    <nav class="bottom-nav" aria-label="하단 네비게이션">
      <a class="nav-item" href="#">
        <!-- 아이콘 사용자가 직접 넣기 -->
        <img class="nav-icon" src="" alt="" />
        <span class="nav-text">홈</span>
      </a>

      <a class="nav-item" href="#">
        <img class="nav-icon" src="" alt="" />
        <span class="nav-text">주문/배송</span>
      </a>

      <a class="nav-item" href="#">
        <img class="nav-icon" src="" alt="" />
        <span class="nav-text">커뮤니티</span>
      </a>

      <a class="nav-item" href="#">
        <img class="nav-icon" src="" alt="" />
        <span class="nav-text">검색</span>
      </a>

      <a class="nav-item is-active" href="#">
        <img class="nav-icon" src="" alt="" />
        <span class="nav-text">마이</span>
      </a>
    </nav>
  </div>

  <script src="./js/avatar.js"></script>
</body>
</html>

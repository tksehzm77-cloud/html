<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>달몽 Splash</title>
  <link rel="stylesheet" href="./css/splash.css" />
</head>
<body>
  <main class="splash" role="img" aria-label="달몽 스플래시 화면">
    <!-- 배경 이미지 -->
    <img class="splash__bg" src="./images/splash_img.png" alt="" />

    <!-- 반짝이 오버레이 (깜빡임 애니메이션) -->
    <div class="sparkles" aria-hidden="true">
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <span class="sparkle s4"></span>
      <span class="sparkle s5"></span>
      <span class="sparkle s6"></span>
      <span class="sparkle s7"></span>
      <span class="sparkle s8"></span>
      <span class="sparkle s9"></span>
      <span class="sparkle s10"></span>
      <span class="sparkle s11"></span>
      <span class="sparkle s12"></span>
    </div>

    <!-- 텍스트 오버레이 -->
    <div class="splash__overlay">
      <h1 class="splash__title">달몽</h1>
    </div>
  </main>

  <script src="./js/splash.js"></script>
</body>
</html>

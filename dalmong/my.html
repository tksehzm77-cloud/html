<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>마이 페이지</title>

  <!-- Noto Sans (그 외 텍스트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/my.css" />
</head>
<body>
  <div class="app" role="application">
    <!-- Top App Bar -->
    <header class="topbar" role="banner">
      <button class="icon-btn" type="button" aria-label="뒤로가기" id="backBtn">
        <!-- 사용자가 직접 넣을 뒤로가기 아이콘 -->
        <img class="icon-img" src="./images/back.png" alt="" data-placeholder="back-icon" />
      </button>

      <h1 class="topbar-title">마이 페이지</h1>

      <button class="icon-btn" type="button" aria-label="메뉴" id="menuBtn">
        <!-- 사용자가 직접 넣을 메뉴(햄버거) 아이콘 -->
        <img class="icon-img" src="./images/menu.png" alt="" data-placeholder="menu-icon" />
      </button>
    </header>

    <main class="content" role="main">
      <!-- 중앙 이미지 카드 -->
<section class="avatar-card" aria-label="아바타 영역">
  <div class="avatar-illust">
    <img class="avatar-img" src="./images/avatar_off_img.png" alt="아바타 이미지" data-placeholder="avatar-image" />
  </div>
</section>

<!-- 나의 아바타 꾸미기 버튼 (완전 분리) -->
<a class="avatar-cta" href="avatar.html" id="avatarDecorateLink" aria-label="나의 아바타 꾸미기">
  <span class="cta-icon">
    <img class="cta-icon-img" src="./images/my_page_moon.png" alt="달 아이콘" data-placeholder="moon-icon" />
  </span>
  <span class="cta-text">나의 아바타 꾸미기</span>
</a>


      <!-- List -->
      <section class="list" aria-label="마이 메뉴">
        <a class="list-item" href="order.html" data-href="orders.html">
          <span class="li-left">
            <!-- 사용자가 직접 넣을 아이콘 -->
            <img class="li-icon" src="./images/my_order.png" alt="주문/배송" data-placeholder="order-icon" />
            <span class="li-title">주문 배송</span>
            <span class="li-badge" aria-label="새 알림">N</span>
          </span>
          <span class="li-right">
            <img class="li-chevron" src="./images/next.png" alt="더보기" data-placeholder="chevron-icon" />
          </span>
        </a>

        <a class="list-item" href="#" data-href="reviews.html">
          <span class="li-left">
            <img class="li-icon" src="./images/pencil.png" alt="" data-placeholder="review-icon" />
            <span class="li-title">구매 후기</span>
            <span class="li-meta">55</span>
          </span>
          <span class="li-right">
            <img class="li-chevron" src="./images/next.png" alt="" data-placeholder="chevron-icon" />
          </span>
        </a>

        <a class="list-item" href="#" data-href="points.html">
          <span class="li-left">
            <img class="li-icon" src="./images/cash.png" alt="" data-placeholder="point-icon" />
            <span class="li-title">적립금</span>
            <span class="li-meta">825P</span>
          </span>
          <span class="li-right">
            <img class="li-chevron" src="./images/next.png" alt="" data-placeholder="chevron-icon" />
          </span>
        </a>

        <a class="list-item" href="#" data-href="giftbox.html">
          <span class="li-left">
            <img class="li-icon" src="./images/gift.png" alt="" data-placeholder="gift-icon" />
            <span class="li-title">선물함</span>
            <span class="li-meta">10</span>
          </span>
          <span class="li-right">
            <img class="li-chevron" src="./images/next.png" alt="" data-placeholder="chevron-icon" />
          </span>
        </a>

        <a class="list-item" href="#" data-href="coupons.html">
          <span class="li-left">
            <img class="li-icon" src="./images/coupon.png" alt="" data-placeholder="coupon-icon" />
            <span class="li-title">쿠폰</span>
            <span class="li-meta">4</span>
          </span>
          <span class="li-right">
            <img class="li-chevron" src="./images/next.png" alt="" data-placeholder="chevron-icon" />
          </span>
        </a>
      </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" role="navigation" aria-label="하단 내비게이션">
      <a class="nav-item" href="home.html" data-href="home.html">
        <img class="nav-icon" src="./images/home_icon.svg" alt="홈" data-placeholder="nav-home-icon" />
        <span class="nav-text">홈</span>
      </a>

      <a class="nav-item" href="#" data-href="orders.html">
        <img class="nav-icon" src="./images/order_icon.svg" alt="주문/배송" data-placeholder="nav-orders-icon" />
        <span class="nav-text">주문/배송</span>
      </a>

      <a class="nav-item" href="#" data-href="community.html">
        <img class="nav-icon" src="./images/community_icon.svg" alt="커뮤니티" data-placeholder="nav-community-icon" />
        <span class="nav-text">커뮤니티</span>
      </a>

      <a class="nav-item" href="#" data-href="search.html">
        <img class="nav-icon" src="./images/search_icon.svg" alt="검색" data-placeholder="nav-search-icon" />
        <span class="nav-text">검색</span>
      </a>

      <a class="nav-item is-active" href="#" data-href="my.html" aria-current="page">
        <img class="nav-icon" src="./images/my_icon_2.svg" alt="마이" data-placeholder="nav-my-icon" />
        <span class="nav-text">마이</span>
      </a>
    </nav>
  </div>

  <script src="./js/my.js"></script>
</body>
</html>

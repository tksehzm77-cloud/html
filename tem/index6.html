<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온도 변환</title>
</head>
<body>
    <script>
        let c = prompt("변환할 섭씨 온도를 숫자로 입력해주세요")
        let f1 = 1.8
        let f2 = 32

        let tem = c * f1 + f2;
        alert("고객님이 입력하신 섭씨 온도" + c + "c는 화씨 온도로" + tem + "f입니다")
    </script>
</body>
</html>

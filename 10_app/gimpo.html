<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>따숨 | 김포시 온열의자 정류소 지도</title>
  <link rel="stylesheet" href="./css/gimpo.css" />
</head>
<body>
  <!-- PC에서도 보이지만 “모바일 앱 화면”처럼 고정 -->
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <img src="./images/logo.png" alt="따숨 로고" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-name">따숨</div>
          <div class="brand-sub">김포시 버스정류장 온열의자 위치 안내</div>
        </div>
      </div>

      <div class="search">
        <input id="q" type="text" placeholder="정류소명 / 주소로 검색" autocomplete="off" />
        <button id="btnClear" class="icon-btn" type="button" aria-label="검색어 지우기">×</button>
        <button id="btnSearch" class="primary" type="button">검색</button>
      </div>
    </header>

    <main class="content">
      <!-- 지도 -->
      <section class="mapwrap">
        <div class="map-topchip">
          <span class="chip">🔥 따숨 ON</span>
          <span class="chip ghostchip">주소 기반 표시</span>
        </div>
        <div id="map" class="map"></div>

        <!-- 선택 상세 (바텀시트) -->
        <aside class="sheet" id="detail">
          <div class="sheet-handle"></div>
          <div class="sheet-head">
            <div class="sheet-title">상세</div>
            <button id="btnCloseDetail" class="ghost" type="button">닫기</button>
          </div>
          <div class="sheet-body" id="detailBody">
            <p class="hint">아래 목록에서 정류소를 선택하면 위치가 지도에 표시됩니다.</p>
          </div>
        </aside>
      </section>

      <!-- 목록 -->
      <section class="panel">
        <div class="panel-head">
          <div class="meta">
            <div class="title">정류소 목록</div>
            <div id="count" class="count">-</div>
          </div>

          <div class="controls">
            <select id="perPage">
              <option value="10" selected>10개</option>
              <option value="20">20개</option>
              <option value="50">50개</option>
            </select>
            <button id="btnReload" class="ghost" type="button">새로고침</button>
          </div>
        </div>

        <div id="list" class="list" role="list"></div>

        <div id="empty" class="empty" hidden>
          <img src="./images/mascot.png" alt="따숨 마스코트" class="empty-mascot" />
          <div class="empty-title">따뜻한 정류소를 찾고 있어요!</div>
          <div class="empty-desc">정류소명이나 주소로 다시 검색해보세요.</div>
        </div>

        <div class="pager">
          <button id="prev" class="ghost" type="button">이전</button>
          <div id="pages" class="pages"></div>
          <button id="next" class="ghost" type="button">다음</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <!-- 카카오맵 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=48fbd67fa46bf2693d779bf17f684787&libraries=services"></script>
  <script src="/js/gimpo.js"></script>
</body>
</html>

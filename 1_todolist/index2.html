<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>오늘 할 일 · Heart Pop</title>
  <style>
    /* ===== Reset ===== */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
      background:linear-gradient(180deg,#F2FFF6 0%,#FFEFF5 100%);
      color:#1F2937;
      overflow-x:hidden;
    }
    button,input{font-family:inherit}

    :root{
      --green:#4ADE80;
      --green-dark:#22C55E;
      --pink:#FB7185;
      --pink-strong:#F43F5E;
      --pink-soft:#FFE4EA;
      --ink:#1F2937;
      --muted:#6B7280;
      --card:#FFFFFF;
      --line:#E5E7EB;
      --radius:18px;
      --shadow:0 14px 30px rgba(0,0,0,.10);
      --safeB: env(safe-area-inset-bottom, 0px);
    }

    .wrap{
      min-height:100vh;
      padding:18px 16px calc(18px + 160px + var(--safeB));
      max-width:520px;
      margin:0 auto;
    }

    /* ===== Subtle floating dots ===== */
    body:before{
      content:"";
      position:fixed;inset:0;pointer-events:none;opacity:.25;
      background:
        radial-gradient(circle at 20% 20%, rgba(251,113,133,.25) 0 6px, transparent 7px),
        radial-gradient(circle at 70% 30%, rgba(74,222,128,.25) 0 7px, transparent 8px),
        radial-gradient(circle at 40% 80%, rgba(251,113,133,.25) 0 5px, transparent 6px);
    }

    /* ===== Header ===== */
    .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px}
    .title h1{font-size:22px;letter-spacing:-.3px;line-height:1.15}
    .title .date{font-size:13px;color:var(--muted);margin-top:6px}

    .chip{
      padding:10px 12px;border-radius:999px;
      background:linear-gradient(135deg,var(--pink),var(--green));
      color:#fff;font-weight:900;font-size:12px;
      box-shadow:var(--shadow);
      white-space:nowrap;
    }

    /* ===== Card ===== */
    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ===== Add ===== */
    .add{display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
    .add input{
      flex:1;height:44px;border-radius:14px;border:1px solid var(--line);
      padding:0 14px;font-size:14px;background:#F9FAFB;
      outline:none;
    }
    .add input:focus{border-color:rgba(34,197,94,.55); box-shadow:0 0 0 4px rgba(34,197,94,.14)}

    .btn{
      height:44px;padding:0 16px;border:none;border-radius:14px;
      background:linear-gradient(135deg,var(--green),var(--green-dark));
      color:#fff;font-weight:900;cursor:pointer;
      box-shadow:0 12px 24px rgba(34,197,94,.18);
    }
    .btn:active{transform:translateY(1px)}

    /* ===== Toolbar ===== */
    .toolbar{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
    .seg{display:flex;gap:6px;background:#F1F5F9;border-radius:999px;padding:4px}
    .seg button{
      border:none;background:transparent;font-weight:900;font-size:12px;
      padding:8px 10px;border-radius:999px;cursor:pointer;color:var(--ink)
    }
    .seg button[aria-pressed="true"]{background:var(--pink-soft);color:var(--pink-strong)}

    .ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 10px;font-size:12px;font-weight:900;cursor:pointer}
    .ghost:active{transform:translateY(1px)}

    /* ===== List ===== */
    .list{list-style:none}
    .item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);background:#fff}
    .item:last-child{border-bottom:none}

    .check{
      width:22px;height:22px;border-radius:50%;
      border:2px solid var(--pink);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
      position:relative;
      background:#fff;
    }
    .check:active{transform:scale(.97)}
    .item.done .check{background:var(--pink);border-color:var(--pink);color:#fff}

    .text{flex:1;min-width:0}
    .text .t{font-size:14px;font-weight:900;word-break:keep-all}
    .item.done .text .t{text-decoration:line-through;color:var(--muted)}

    .icon{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;background:#fff}
    .icon:active{transform:translateY(1px)}

    /* ===== Bottom progress ===== */
    .bottom{
      position:fixed;left:0;right:0;bottom:0;
      background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
      border-top:1px solid var(--line);
      padding:14px 16px calc(14px + var(--safeB));
    }
    .bottom .inner{max-width:520px;margin:0 auto}

    .progress-box{
      display:flex;align-items:center;gap:16px;
      background:linear-gradient(135deg,#ECFEF3,#FFE4EA);
      border-radius:20px;padding:16px;box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .ring{width:84px;height:84px;position:relative;flex:0 0 auto}
    .ring svg{transform:rotate(-90deg)}
    .ring .pct{
      position:absolute;inset:0;display:grid;place-items:center;
      font-weight:900;font-size:16px;color:var(--pink-strong)
    }

    .progress-text b{font-size:16px}
    .progress-text span{font-size:13px;color:var(--muted)}

    /* ===== Motion: task complete heart pop ===== */
    .pop-heart{
      position:fixed;
      left:0;top:0;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:9999;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.18));
      animation: heartPop 720ms cubic-bezier(.2,.9,.15,1) forwards;
    }

    @keyframes heartPop{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-12deg)}
      20%{opacity:1; transform:translate(-50%,-50%) scale(1.05) rotate(8deg)}
      60%{opacity:1; transform:translate(-50%,-90%) scale(.98) rotate(-6deg)}
      100%{opacity:0; transform:translate(-50%,-150%) scale(.8) rotate(10deg)}
    }

    /* ===== Motion: 100% celebration ===== */
    .celebrateGlow{
      animation: glowPulse 900ms ease-in-out infinite;
    }
    @keyframes glowPulse{
      0%,100%{box-shadow:0 14px 30px rgba(0,0,0,.10)}
      50%{box-shadow:0 18px 38px rgba(244,63,94,.20), 0 16px 34px rgba(34,197,94,.18)}
    }

    .ringShimmer circle#progressCircle{
      filter: drop-shadow(0 10px 16px rgba(244,63,94,.18));
      animation: ringShine 1.2s linear infinite;
      transform-origin:42px 42px;
    }
    @keyframes ringShine{
      0%{opacity:.85}
      50%{opacity:1}
      100%{opacity:.85}
    }

    .sparkle{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:0;
    }
    .celebrate .sparkle{
      opacity:1;
      animation: sparkleMove 1.1s ease-in-out infinite;
    }
    @keyframes sparkleMove{
      0%{transform:translateX(-8px) rotate(0deg); opacity:.65}
      50%{transform:translateX(8px) rotate(6deg); opacity:1}
      100%{transform:translateX(-8px) rotate(0deg); opacity:.65}
    }

    .confetti-heart{
      position:absolute;
      left:50%; top:50%;
      transform:translate(-50%,-50%);
      pointer-events:none;
      font-weight:900;
      opacity:0;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.18));
      animation: confettiBurst 900ms cubic-bezier(.2,.9,.15,1) forwards;
    }

    @keyframes confettiBurst{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.4)}
      15%{opacity:1}
      100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.9)}
    }

    /* ===== Reduced motion ===== */
    @media (prefers-reduced-motion: reduce){
      .pop-heart,.confetti-heart,.celebrateGlow,.ringShimmer circle#progressCircle,.celebrate .sparkle{animation:none !important}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="title">
        <h1>오늘 할 일 💚💗</h1>
        <div class="date" id="today"></div>
      </div>
      <div class="chip" id="chipText">0 / 0 완료</div>
    </header>

    <section class="card">
      <div class="add">
        <input id="taskInput" placeholder="오늘 할 일을 적어주세요 💕" autocomplete="off" />
        <button class="btn" id="addBtn" type="button">추가</button>
      </div>

      <div class="toolbar">
        <div class="seg" role="group" aria-label="필터">
          <button type="button" class="segBtn" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="segBtn" data-filter="active" aria-pressed="false">진행중</button>
          <button type="button" class="segBtn" data-filter="done" aria-pressed="false">완료</button>
        </div>
        <div style="display:flex;gap:6px">
          <button type="button" class="ghost" id="clearDone">완료삭제</button>
          <button type="button" class="ghost" id="clearAll">전체삭제</button>
        </div>
      </div>

      <ul class="list" id="list" aria-label="오늘 할 일 목록"></ul>
    </section>
  </main>

  <nav class="bottom" aria-label="달성률">
    <div class="inner">
      <div class="progress-box" id="progressBox">
        <!-- subtle sparkle overlay -->
        <svg class="sparkle" viewBox="0 0 320 120" aria-hidden="true">
          <g fill="none" stroke-linecap="round" stroke-width="6">
            <path d="M40 30l10 0" stroke="rgba(244,63,94,.45)"/>
            <path d="M70 55l12 0" stroke="rgba(34,197,94,.42)"/>
            <path d="M250 34l12 0" stroke="rgba(244,63,94,.35)"/>
            <path d="M280 64l14 0" stroke="rgba(34,197,94,.30)"/>
          </g>
          <g opacity=".6">
            <circle cx="120" cy="22" r="6" fill="rgba(244,63,94,.22)"/>
            <circle cx="210" cy="88" r="7" fill="rgba(34,197,94,.18)"/>
            <circle cx="290" cy="22" r="5" fill="rgba(244,63,94,.18)"/>
          </g>
        </svg>

        <div class="ring" id="ring">
          <svg width="84" height="84" aria-hidden="true">
            <circle cx="42" cy="42" r="36" stroke="#FBCFE8" stroke-width="10" fill="none" />
            <circle id="progressCircle" cx="42" cy="42" r="36" stroke="#FB7185" stroke-width="10" fill="none"
              stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="226" />
          </svg>
          <div class="pct" id="progressPct">0%</div>
        </div>

        <div class="progress-text">
          <b>오늘 달성률</b><br />
          <span id="progressText">아직 시작 전이에요 💗</span>
        </div>
      </div>
    </div>
  </nav>

<script>
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const todayEl=$('#today'),listEl=$('#list'),chip=$('#chipText');
  const circle=$('#progressCircle'),pctEl=$('#progressPct'),pText=$('#progressText');
  const progressBox=$('#progressBox'), ring=$('#ring');

  const R=36, C=2*Math.PI*R;
  circle.style.strokeDasharray=C;

  let tasks=[],filter='all';
  const key='heart_todo_'+new Date().toDateString();
  let celebrated=false;

  todayEl.textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());

  function save(){localStorage.setItem(key,JSON.stringify(tasks))}
  function load(){tasks=JSON.parse(localStorage.getItem(key)||'[]')}

  function popHeartAt(x,y){
    const el=document.createElement('div');
    el.className='pop-heart';
    el.style.left=x+'px';
    el.style.top=y+'px';

    // Randomize slightly
    const size = 18 + Math.random()*10;
    const rot = (-10 + Math.random()*20).toFixed(1);
    const color = Math.random() < .5 ? getComputedStyle(document.documentElement).getPropertyValue('--pink-strong').trim() : getComputedStyle(document.documentElement).getPropertyValue('--green-dark').trim();

    el.style.fontSize = size+'px';
    el.style.color = color;
    el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
    el.textContent='❤';

    document.body.appendChild(el);
    el.addEventListener('animationend', ()=>el.remove(), {once:true});
  }

  function burstCelebration(){
    // glow + shimmer
    progressBox.classList.add('celebrateGlow','celebrate');
    ring.classList.add('ringShimmer');

    // heart confetti around ring
    const boxRect = progressBox.getBoundingClientRect();
    const ringRect = ring.getBoundingClientRect();
    const cx = ringRect.left + ringRect.width/2;
    const cy = ringRect.top + ringRect.height/2;

    const colors = ['var(--pink-strong)','var(--pink)','var(--green-dark)','var(--green)'];
    const count = 14;

    for(let i=0;i<count;i++){
      const h = document.createElement('div');
      h.className='confetti-heart';
      h.textContent = Math.random() < .2 ? '💖' : '❤';

      const ang = (Math.PI*2) * (i / count) + (Math.random()*.35);
      const dist = 34 + Math.random()*44;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist;
      const rot = (-30 + Math.random()*60) + 'deg';
      const size = 14 + Math.random()*10;

      h.style.setProperty('--dx', dx.toFixed(1)+'px');
      h.style.setProperty('--dy', dy.toFixed(1)+'px');
      h.style.setProperty('--rot', rot);
      h.style.fontSize = size+'px';
      h.style.color = `var(${colors[Math.floor(Math.random()*colors.length)]})`;

      // place relative to viewport
      h.style.left = cx + 'px';
      h.style.top  = cy + 'px';
      h.style.position = 'fixed';
      h.style.zIndex = 9998;

      document.body.appendChild(h);
      h.addEventListener('animationend', ()=>h.remove(), {once:true});
    }

    // auto stop glow after a bit (but keep shimmer while 100%)
    setTimeout(()=>{
      if(celebrated){
        progressBox.classList.remove('celebrateGlow');
      }
    }, 2200);
  }

  function stopCelebration(){
    progressBox.classList.remove('celebrateGlow','celebrate');
    ring.classList.remove('ringShimmer');
  }

  function render(){
    const done=tasks.filter(t=>t.done).length;
    const total=tasks.length;
    chip.textContent=`${done} / ${total} 완료`;

    const rate=total?Math.round(done/total*100):0;
    pctEl.textContent=rate+'%';
    circle.style.strokeDashoffset=C-(C*rate/100);
    pText.textContent=total?`지금까지 ${rate}% 달성했어요 💕`:'아직 시작 전이에요 💗';

    // 100% celebration trigger
    if(total>0 && rate===100){
      if(!celebrated){
        celebrated=true;
        burstCelebration();
      } else {
        // keep shimmer if still 100%
        progressBox.classList.add('celebrate');
        ring.classList.add('ringShimmer');
      }
    } else {
      celebrated=false;
      stopCelebration();
    }

    listEl.innerHTML='';
    tasks
      .filter(t=>filter==='all'||(filter==='done'?t.done:!t.done))
      .forEach(t=>{
        const li=document.createElement('li');
        li.className='item'+(t.done?' done':'');
        li.innerHTML=`
          <button class="check" type="button" aria-label="${t.done?'완료 해제':'완료'}">${t.done?'❤':''}</button>
          <div class="text"><div class="t"></div></div>
          <button class="icon edit" type="button" aria-label="수정">✏️</button>
          <button class="icon del" type="button" aria-label="삭제">🗑</button>`;

        li.querySelector('.t').textContent=t.text;

        li.querySelector('.check').onclick=(e)=>{
          const wasDone = t.done;
          t.done=!t.done;
          save();
          render();

          // heart pop only when turning to done
          if(!wasDone && t.done){
            const r = e.currentTarget.getBoundingClientRect();
            popHeartAt(r.left + r.width/2, r.top + r.height/2);
          }
        };

        li.querySelector('.edit').onclick=()=>{
          const next = prompt('일정을 수정하세요', t.text);
          if(next == null) return;
          const text = next.trim();
          if(!text) return;
          t.text = text;
          save();
          render();
        };

        li.querySelector('.del').onclick=()=>{tasks=tasks.filter(x=>x!==t);save();render()};
        listEl.appendChild(li);
      });
  }

  $('#addBtn').onclick=()=>{
    const v=$('#taskInput').value.trim();
    if(!v) return;
    tasks.unshift({text:v,done:false});
    $('#taskInput').value='';
    save();
    render();
  };

  $('#taskInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('#addBtn').click(); });

  $$('.segBtn').forEach(b=>b.onclick=()=>{
    filter=b.dataset.filter;
    $$('.segBtn').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    render();
  });

  $('#clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};
  $('#clearAll').onclick=()=>{tasks=[];save();render()};

  load();
  render();
</script>
</body>
</html>
